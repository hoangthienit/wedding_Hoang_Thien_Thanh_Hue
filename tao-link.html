<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tạo link mời khách</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fdeaf0; color: #5a3442; margin: 0; padding: 24px 16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { color: #bf4f72; font-size: 1.5rem; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #f2b2c4; border-radius: 10px; font: inherit; }
  textarea { min-height: 140px; }
  button { background: #d96b8c; color: #fff; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; font: inherit; }
  table { width: 100%; border-collapse: collapse; margin-top: 18px; background: #fff; border-radius: 12px; overflow: hidden; }
  td, th { padding: 8px 10px; border-bottom: 1px solid #fdeaf0; text-align: left; font-size: .9rem; word-break: break-all; }
  th { background: #f9d3de; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .note { font-size: .85rem; color: #9a7482; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💌 Tạo link mời từng khách</h1>
  <p class="note">Trang này chỉ dành cho bạn, không cần gửi cho khách.</p>
  <label>Địa chỉ thiệp sau khi đăng (ví dụ https://ten.github.io/thiepcuoi/)</label>
  <input id="base" placeholder="https://ten-mien-cua-ban/thiepcuoi/" />
  <label>Danh sách khách (giống file guests.txt, mỗi dòng "1. Anh A")</label>
  <textarea id="list"></textarea>
  <div class="row">
    <button id="gen">Tạo link</button>
    <button id="copyAll">Sao chép tất cả</button>
  </div>
  <table id="out"><thead><tr><th>#</th><th>Khách</th><th>Link</th><th></th></tr></thead><tbody></tbody></table>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  try { $("#base").value = localStorage.getItem("tl-base") || ""; } catch (e) {}
  fetch("guests.txt?v=" + Date.now()).then((r) => r.ok ? r.text() : "").then((t) => { if (t && !$("#list").value) $("#list").value = t; gen(); }).catch(() => {});
  let rows = [];
  function gen() {
    let base = $("#base").value.trim();
    try { localStorage.setItem("tl-base", base); } catch (e) {}
    if (base && !base.endsWith("/")) base += "/";
    rows = $("#list").value.split(/\r?\n/).map((l) => l.trim().match(/^(\d+)\s*[.)\-:]\s*(.+)$/)).filter(Boolean)
      .map((m) => ({ id: m[1], name: m[2], url: base + m[1] }));
    const tb = $("#out tbody"); tb.innerHTML = "";
    rows.forEach((r) => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td></td><td></td><td></td><td><button>Copy</button></td>";
      tr.children[0].textContent = r.id; tr.children[1].textContent = r.name; tr.children[2].textContent = r.url;
      tr.querySelector("button").onclick = () => navigator.clipboard.writeText(r.url);
      tb.appendChild(tr);
    });
  }
  $("#gen").onclick = gen;
  $("#copyAll").onclick = () => navigator.clipboard.writeText(rows.map((r) => `${r.id}. ${r.name}: ${r.url}`).join("\n"));
</script>
</body>
</html>
